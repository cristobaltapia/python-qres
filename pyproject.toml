[project]
name = "qres-reader"
version = "0.1.7"
description = "A python reader for *.qres binary files"
readme = "README.md"
authors = [
    { name = "Cristóbal Tapia Camú", email = "crtapia@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.4",
    "pandas>=3.0.2",
]

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
